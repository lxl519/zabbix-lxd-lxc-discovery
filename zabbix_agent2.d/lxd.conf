# ==============================================================================
# Zabbix Agent 2 UserParameters for LXD / LXC Container Monitoring
# Place in: /etc/zabbix/zabbix_agent2.d/lxd.conf (or /etc/zabbix/zabbix_agentd.d/)
# ==============================================================================

# Low-Level Discovery
UserParameter=lxd.discovery,/etc/zabbix/scripts/lxd_monitor.py discover

# State & Lifecycle
UserParameter=lxd.container.status[*],/etc/zabbix/scripts/lxd_monitor.py get "$1" status
UserParameter=lxd.container.status_code[*],/etc/zabbix/scripts/lxd_monitor.py get "$1" status_code

# Memory Metrics
UserParameter=lxd.container.memory.usage[*],/etc/zabbix/scripts/lxd_monitor.py get "$1" memory_usage
UserParameter=lxd.container.memory.peak[*],/etc/zabbix/scripts/lxd_monitor.py get "$1" memory_peak
UserParameter=lxd.container.memory.swap[*],/etc/zabbix/scripts/lxd_monitor.py get "$1" memory_swap

# CPU & Storage Metrics
UserParameter=lxd.container.cpu.usage[*],/etc/zabbix/scripts/lxd_monitor.py get "$1" cpu_usage
UserParameter=lxd.container.disk.usage[*],/etc/zabbix/scripts/lxd_monitor.py get "$1" disk_usage

# Network Metrics
UserParameter=lxd.container.net.rx[*],/etc/zabbix/scripts/lxd_monitor.py get "$1" net_rx "$2"
UserParameter=lxd.container.net.tx[*],/etc/zabbix/scripts/lxd_monitor.py get "$1" net_tx "$2"
UserParameter=lxd.container.ipv4[*],/etc/zabbix/scripts/lxd_monitor.py get "$1" ipv4 "$2"
